name: astrbot_plugin_reply_gate
display_name: 回复判断
short_desc: 由判断模型决定机器人要不要在群里主动接话。
desc: |
  接管群聊里的「主动插嘴」：没有 @ 机器人的群消息，先按黑名单和规则过滤，
  再交给判断模型（System One）分别判断这句话是对机器人说的、对别人说的、
  对全群的开放问题（比如「吃了吗」），还是开了个新话题。对机器人说的就回；
  开放问题和新话题按设定的概率接话；接着别人的话题聊、对别人说的不插嘴。
  判断时会参考前文的时间、机器人刚才回的是谁、这句话引用了谁。判断模型不可用时退回对话模型。
  判断模型看不到图片，带图的消息会连同图片交给对话模型判断（可关闭）。

  @ 了机器人、同时也 @ 了别人的消息（比如「@小明，和 @机器人 说句话」），
  也会判断是不是真的对机器人说的，不是的话不回（可关闭）。只 @ 机器人的消息照常回复。
  机器人的名字跟着当前会话的人格走。打开调试模式可以查看每次判断的完整过程。

  使用前请关闭 AstrBot 内置的「主动回复」，否则两边会同时插嘴。

  在插件页打开「回复判断」面板，可以管理名单、选择判断模型、调整规则、试一句话。
  指令：`/回复判断`（管理员）查看最近 10 次判断结果。
version: v1.6.1
author: rwx9032
repo: https://github.com/rwx9032/astrbot_plugin_reply_gate
astrbot_version: ">=4.29,<5"
views:
  - name: panel
    description: 回复判断的设置面板
